# The dogfood gate: this repository enforces its own controls on its own pull
# requests, using the binary it ships.
#
# This is the GitHub mirror's copy. Changes are reviewed on Gitea, so the gate
# that actually runs on a pull request is .gitea/workflows/controls.yml. The two
# are the same gate — same binary, same flags, one forge-specific step for
# reading the approver set — and must be kept in step.
name: controls

on:
  # Most changes land here as a direct push to main. A gate that only fires on
  # pull requests would never have tiered any of them — so push tiers the pushed
  # range and records evidence. It cannot verify approvals: a direct push has no
  # approver set to read, and the record says so rather than passing them.
  push:
    branches: [main]
  pull_request:
  # Approvals land after a pull request is opened, so the gate re-runs when a
  # review is submitted or dismissed. Without this trigger the approver controls
  # could only ever be evaluated against an empty set, which is precisely the
  # failure mode CAF-SDLC-011 exists to prevent.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read # to read the pull request's reviews

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin both triggers to the pull request head: on pull_request_review the
          # default checkout would be the base branch. refs/pull/N/head rather than
          # the head sha, because it exists in this repository even when the pull
          # request comes from a fork. Full history, because the tier is computed
          # against the merge base.
          ref: "${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}"
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile=cover.out

      # The README badge states a floor rather than an exact figure: raising
      # coverage needs no README edit, and dropping below the advertised number
      # fails the build. A number nothing checks is a claim, not evidence.
      - name: Coverage is at least what the README advertises
        run: |
          actual=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          stated=$(grep -o 'coverage-[0-9]\+%25%2B' README.md | head -1 | sed 's/coverage-//;s/%25%2B//')
          echo "coverage ${actual}% (README advertises ${stated}%+)"
          awk -v a="$actual" -v s="$stated" 'BEGIN { exit !(a + 0 >= s + 0) }' || {
            echo "coverage ${actual}% is below the ${stated}% the README advertises"
            exit 1
          }

      - name: Build
        run: make build

      - name: Demo
        # The first command anyone reading the README runs. If it breaks, it
        # breaks here rather than in front of them.
        run: make demo

      - name: The committed evidence records are the ones the demo just produced
        # `make demo` overwrote examples/traderx/evidence/ above. Committed
        # evidence that no longer matches a real run is worse than none: it
        # reads as a record and is a fossil. computed_at is the wall clock of
        # the run and is expected to differ; nothing else may.
        run: |
          set -euo pipefail
          for f in examples/traderx/evidence/*.json; do
            diff -u <(git show "HEAD:$f" | jq 'del(.computed_at)') \
                    <(jq 'del(.computed_at)' "$f") \
              || { echo "::error file=$f::stale — re-run 'make demo' and commit the result"; exit 1; }
          done

      - name: Collect the approver set
        id: approvers
        # Nothing to read on a push; the tier step then records the
        # approver controls as unverified instead of as met.
        if: github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # GitHub counts the latest non-comment review per reviewer: a comment
          # left after an approval does not revoke it, but a dismissal or a
          # change request does. Count them the same way, or this gate would
          # credit approvals the forge itself no longer honours.
          approvers=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            --jq 'map(select(.state != "COMMENTED"))
                  | group_by(.user.login) | map(last)
                  | map(select(.state == "APPROVED") | .user.login)
                  | unique | join(",")')
          echo "list=${approvers}" >> "$GITHUB_OUTPUT"
          echo "approvers: ${approvers:-(none)}"

      - name: Tier this change
        id: tier
        # Event data reaches the shell through the environment, never through
        # ${{ }} interpolation into the script body.
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          APPROVERS: ${{ steps.approvers.outputs.list }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          if [ -n "${PR}" ]; then
            base="origin/${BASE_REF}"; head="${HEAD_SHA}"; id="PR-${PR}"
            # --approvers-known: the set came from an actual query, so an empty
            # result means nobody approved, not that nobody looked.
            approval=(--approvers "${APPROVERS}" --approvers-known)
          else
            base="${BEFORE}"; head="${AFTER}"; id="push-${AFTER}"
            # No --approvers-known on a push. There was no approver set to read,
            # so the approver controls are recorded as required and unverified
            # rather than as a verified zero that nobody could ever have met.
            approval=()
            # The first push of a branch reports an all-zero "before", and after
            # a force-push the old "before" is no longer reachable. Either way
            # there is no range to diff, so fall back to the pushed commit alone
            # rather than failing the gate on a history event.
            case "${base}" in *[!0]*) ;; *) base="${head}~1" ;; esac
            git cat-file -e "${base}^{commit}" 2>/dev/null || base="${head}~1"
          fi
          ./bin/sdlc-controls tier \
            --base "${base}" \
            --head "${head}" \
            --config config/components.yaml \
            --policy config/tier-policy.example.yaml \
            --change-id "${id}" \
            --author "${AUTHOR}" \
            "${approval[@]}" \
            --evidence-out evidence.json \
          | tee tier.txt

      - name: Post tier and reasons
        if: always()
        run: |
          # The job summary, not a pull request comment: a pull_request run from
          # a fork gets a read-only token, and a gate that cannot report on fork
          # contributions is not a gate.
          {
            echo '## SDLC controls'
            echo
            echo '```'
            cat tier.txt 2>/dev/null || echo 'the controls run did not produce a decision'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-controls-evidence
          path: evidence.json
          if-no-files-found: warn

  action:
    # The action carries no logic, but it has to build: a wrapper nobody can
    # build is a wrapper nobody can use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the action image
        run: docker build -f action/Dockerfile -t sdlc-controls-action .
      - name: Smoke-test the entrypoint
        run: docker run --rm sdlc-controls-action --help
