# This repository's own component map — the one the dogfood gate in
# .github/workflows/controls.yml runs against. config/components.example.yaml is
# the annotated template for other repositories; this is the live map for this one.
version: 1
defaults:
  unmatched_path_tier: high
  breadth_threshold: 4
components:
  - id: engine-core
    match: ["internal/core/**"]
    criticality: high
    shared: true          # every CI adapter depends on it; changes reach all of them
    owners: ["@codeaiforge/maintainers"]

  - id: cli
    match: ["cmd/**"]
    criticality: high
    shared: false
    owners: ["@codeaiforge/maintainers"]

  - id: control-definitions
    match: ["docs/controls/**", "docs/evidence-schema.md", "docs/contract.md"]
    criticality: high
    shared: false
    owners: ["@codeaiforge/maintainers"]

  # The published wire contract: the DTOs and the schemas that describe them.
  # Shared because it is the interface consumers depend on — a change here
  # reaches every one of them, which is exactly what `shared` is a stand-in for.
  # The DTO and its schema move together, so they are one component, not two.
  - id: contract
    match: ["internal/contract/**", "schemas/**"]
    criticality: high
    shared: true
    owners: ["@codeaiforge/maintainers"]

  - id: control-config
    match: ["config/**"]
    criticality: high
    shared: false
    owners: ["@codeaiforge/maintainers"]

  - id: ci
    match: [".github/**", ".gitea/**"]
    criticality: high
    shared: false
    owners: ["@codeaiforge/maintainers"]

  - id: action
    match: ["action/**"]
    criticality: medium
    shared: false
    owners: ["@codeaiforge/maintainers"]

  - id: docs
    match: ["docs/**"]
    criticality: low
    shared: false

  - id: examples
    match: ["examples/**", "scripts/**"]   # the demo, its map and its evidence
    criticality: low
    shared: false

  - id: project-meta
    match: ["*.md", "LICENSE", "Makefile", "go.mod", "go.sum", ".gitignore"]
    criticality: low
    shared: false
